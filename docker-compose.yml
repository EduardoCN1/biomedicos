# Imagen única del proyecto (Dockerfile): la comparten seed, api, recommender y
# ml-validator, cada uno con su propio comando de arranque. Solo 'api' la construye;
# si la construyeran todos, las cuatro construcciones chocarían al nombrarla.
# pull_policy: never evita que Compose intente descargarla de Docker Hub (no existe allí).
x-app: &app
  image: biomedicos-app
  pull_policy: never
  restart: unless-stopped

# restart: unless-stopped: cuando Docker arranca (por ejemplo, al encender el equipo) vuelve a
# levantar los servicios que estaban en marcha, salvo los detenidos a mano con 'docker compose stop'.
# 'seed' no lo usa: se ejecuta una vez en cada 'docker compose up' y termina.

# Puertos: solo el de la aplicación web (frontend) es accesible desde la red. El resto se
# publica en 127.0.0.1, es decir, solo desde el propio equipo que ejecuta Docker.

services:
  rabbitmq:
    image: rabbitmq:3-management
    container_name: biomedicos-rabbitmq
    restart: unless-stopped
    # Solo se publica la consola de administración. El puerto AMQP (5672) lo usan los
    # servicios por la red interna de Docker (rabbitmq:5672) y no hace falta en el equipo.
    ports:
      - "127.0.0.1:15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  neo4j:
    image: neo4j:5
    container_name: biomedicos-neo4j
    restart: unless-stopped
    ports:
      - "127.0.0.1:7474:7474"
      - "127.0.0.1:7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/backups:/backups
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u ${NEO4J_USER:-neo4j} -p ${NEO4J_PASSWORD:-password} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 30s

  # Carga data/*.csv en Neo4j solo si la base está vacía; termina al acabar.
  seed:
    <<: *app
    container_name: biomedicos-seed
    command: ["python", "./scripts/import_csv.py"]
    environment:
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
    depends_on:
      neo4j:
        condition: service_healthy
    restart: "no"

  api:
    <<: *app
    build: .
    container_name: biomedicos-api
    ports:
      # La página no usa este puerto (pasa por el proxy de frontend); sirve para
      # pruebas directas desde el propio equipo, como test-pipeline.ps1 o docs/API.md.
      - "127.0.0.1:${API_PORT:-5000}:5000"
    environment:
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      HOST: "0.0.0.0"
      PORT: "5000"
      ENVIRONMENT: "development"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  recommender:
    <<: *app
    container_name: biomedicos-recommender
    command: ["python", "./services/recommender_service.py"]
    environment:
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"
      RECOMMENDATION_REQUEST_QUEUE: "tnm.recommendation.request"
      VALIDATION_REQUEST_QUEUE: "tnm.validation.request"
      VALIDATION_RESULT_QUEUE: "tnm.validation.result"
    depends_on:
      rabbitmq:
        condition: service_healthy
      neo4j:
        condition: service_healthy
      seed:
        condition: service_completed_successfully

  ml-validator:
    <<: *app
    container_name: biomedicos-ml-validator
    command: ["python", "./services/ml_validator_service.py"]
    environment:
      RABBITMQ_URL: "amqp://guest:guest@rabbitmq:5672/%2F"
      VALIDATION_REQUEST_QUEUE: "tnm.validation.request"
      VALIDATION_RESULT_QUEUE: "tnm.validation.result"
    depends_on:
      rabbitmq:
        condition: service_healthy

  # Sirve frontend/ tal cual (los cambios se ven al recargar el navegador) y reenvía
  # /api/... a la API (ver nginx/default.conf).
  frontend:
    image: nginx:alpine
    container_name: biomedicos-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-5500}:80"
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api

volumes:
  neo4j_data:
  neo4j_logs:
