services:
  neo4j:
    image: neo4j:latest
    container_name: biomedicos-neo4j
    ports:
      - "7474:7474"
      - "7687:7687"
    environment:
      NEO4J_AUTH: "${NEO4J_USER:-neo4j}/${NEO4J_PASSWORD:-password}"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
      - ./data/backups:/backups

  api:
    build: .
    container_name: biomedicos-api
    ports:
      - "5000:5000"
    environment:
      NEO4J_URI: "neo4j://neo4j:7687"
      NEO4J_USER: "${NEO4J_USER:-neo4j}"
      NEO4J_PASSWORD: "${NEO4J_PASSWORD:-password}"
      HOST: "0.0.0.0"
      PORT: "5000"
      ENVIRONMENT: "development"
    depends_on:
      - neo4j

volumes:
  neo4j_data:
  neo4j_logs:
