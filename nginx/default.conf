# Configuración del servicio 'frontend' (montada en /etc/nginx/conf.d/default.conf).
# Sirve frontend/ y reenvía /api/... a la API, así la página llama a la API en su mismo
# origen: sin URL ni puerto fijos en el JavaScript y sin peticiones entre orígenes (CORS).
server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno de Docker. Con la dirección de la API en una variable, nginx vuelve a
    # resolver 'api' cada 10 s en lugar de fijar su IP al arrancar: si el contenedor de la
    # API se recrea (por ejemplo con --build) y cambia de IP, el proxy sigue funcionando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api_upstream http://api:5000;

    # /api/pipeline/submit -> http://api:5000/pipeline/submit
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # /pipeline/debug muestra todos los trabajos con los datos de los pacientes: no se
    # expone a la red a través del proxy. Desde el propio equipo sigue disponible en
    # http://localhost:5000/pipeline/debug.
    location = /api/pipeline/debug {
        return 404;
    }
}
